<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets de Bataille — Empire vs République</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --panel:#0f131a; --panel2:#151b24; --line:#232c3a; --txt:#e6ebf2; --mute:#8592a6;
  --emp:#e0313b; --emp-d:#4a1014; --rep:#2f8cff; --rep-d:#0f2a4d; --gold:#f2c14e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;min-height:100vh;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff3 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#fff2 50%,transparent 51%),radial-gradient(1px 1px at 40% 70%,#fff2 50%,transparent 51%),radial-gradient(1px 1px at 85% 15%,#fff3 50%,transparent 51%);
  background-size:300px 300px}
h1,h2,h3,.orb{font-family:Orbitron,sans-serif;letter-spacing:.06em}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none}
input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:clamp(18px,4vw,26px);font-weight:900}
header h1 .e{color:var(--emp)} header h1 .r{color:var(--rep)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--mute)}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.danger{color:#ff7b7b}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;align-self:start}
aside h3{font-size:12px;color:var(--mute);margin:4px 4px 10px}
.blist{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
@media(max-width:820px){.blist{max-height:180px}}
.bitem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:8px;border:1px solid transparent}
.bitem:hover{background:var(--panel2)}
.bitem.on{background:var(--panel2);border-color:var(--gold)}
.bitem .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem .d{font-size:13px;color:var(--mute);flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--line)}
.dot.e{background:var(--emp)} .dot.r{background:var(--rep)}
.newb{width:100%;margin-top:10px}
main{display:flex;flex-direction:column;gap:16px}
.titlebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.titlebar input{background:transparent;border:none;border-bottom:1px dashed var(--line);font-family:Orbitron;font-weight:700;font-size:clamp(16px,3.5vw,22px);padding:4px 0;min-width:0;flex:1}
.titlebar input.date{flex:0 0 120px;font-size:16px;font-family:Rajdhani}
.titlebar input:focus{outline:none;border-color:var(--gold)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.side{border-radius:12px;padding:16px;border:1px solid;position:relative;overflow:hidden}
.side.emp{background:linear-gradient(135deg,var(--emp-d),var(--panel));border-color:#7a1f25}
.side.rep{background:linear-gradient(225deg,var(--rep-d),var(--panel));border-color:#1d4f8f;text-align:right}
.side .lbl{font-family:Orbitron;font-size:12px;letter-spacing:.15em;color:var(--mute)}
.side .big{font-family:Orbitron;font-weight:900;font-size:clamp(34px,8vw,60px);line-height:1.05}
.side.emp .big{color:var(--emp)} .side.rep .big{color:var(--rep)}
.side .sub{font-size:14px;color:var(--mute)}
.bar{height:6px;background:#0006;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.side.emp .bar i{background:var(--emp)} .side.rep .bar i{background:var(--rep);margin-left:auto}
.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:80px}
.vs .orb{font-size:12px;color:var(--mute)}
.vs .diff{font-family:Orbitron;font-weight:900;font-size:24px;color:var(--gold)}
.vs .lead{font-size:13px;text-align:center}
@media(max-width:560px){.score{grid-template-columns:1fr 1fr}.vs{grid-column:1/-1;order:3;flex-direction:row;gap:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-family:Orbitron;font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:500;background:var(--panel2)}
th.e{color:var(--emp)} th.r{color:var(--rep)}
td.grade{text-align:left;font-weight:700;white-space:normal}
td.cost input{width:46px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px}
.ctr{display:inline-flex;align-items:center;gap:4px}
.ctr button{width:30px;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:18px;line-height:1}
.ctr button:active{transform:scale(.92)}
.ctr input{width:40px;text-align:center;background:transparent;border:none;font-weight:700;font-size:18px}
.ctr input:focus{outline:1px solid var(--gold);border-radius:4px}
.emp-col .ctr button:hover{border-color:var(--emp)} .rep-col .ctr button:hover{border-color:var(--rep)}
.lost{font-family:Orbitron;font-weight:700}
.lost.e{color:var(--emp)} .lost.r{color:var(--rep)}
tfoot td{font-weight:700;background:var(--panel2);border-bottom:none}
.tscroll{overflow-x:auto}
/* mobile cards for ranks */
.mobile-ranks{display:none}
@media(max-width:700px){
  .tscroll{display:none}
  .mobile-ranks{display:flex;flex-direction:column}
  .mr{padding:12px;border-bottom:1px solid var(--line)}
  .mr .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .mr .top b{font-size:16px}
  .mr .top label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
  .mr .top input{width:44px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px}
  .mr .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mr .s{border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .mr .s.e{background:#e0313b14;border:1px solid #e0313b40}
  .mr .s.r{background:#2f8cff14;border:1px solid #2f8cff40}
  .mr .s small{font-size:12px;color:var(--mute)}
}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.field label{display:block;font-size:12px;font-family:Orbitron;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.field.e label{color:var(--emp)} .field.r label{color:var(--rep)}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:18px;font-weight:700}
.field.anim{border-color:#f2c14e55}.field.anim label{color:var(--gold)}.field.anim input{font-size:17px}
.field input:focus{outline:none;border-color:var(--gold)}
.warn{border:1px solid #f2c14e55;background:#f2c14e12;color:var(--gold);border-radius:10px;padding:10px 14px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:#111;padding:10px 18px;border-radius:8px;font-weight:700;transition:.25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.user{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}
.user small{color:var(--gold);font-size:12px}
.overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}
.overlay[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box.wide{max-width:560px}
.box h2{font-size:18px;margin-bottom:6px}
.box p.m{color:var(--mute);font-size:14px;margin-bottom:16px}
.box .in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:17px;margin-bottom:10px}
.box .in:focus{outline:none;border-color:var(--gold)}
.box select.in{appearance:none}
.err{color:#ff7b7b;font-weight:600;min-height:22px;font-size:14px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc b{display:block}.acc small{color:var(--mute)}
.addrow{display:grid;grid-template-columns:1fr 90px;gap:8px}
.ro input:disabled,.ro button:disabled{opacity:.45;cursor:not-allowed}
footer{color:var(--mute);font-size:13px;text-align:center;padding:24px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="e">EMPIRE</span> <span style="color:var(--mute)">VS</span> <span class="r">RÉPUBLIQUE</span></h1>
    <div class="actions" id="topActions" hidden>
      <span class="user" id="userChip"></span>
      <button class="btn" id="accessBtn" hidden>👥 Accès</button>
      <button class="btn" id="exportBtn" hidden>⬇ Sauvegarde</button>
      <button class="btn danger" id="logoutBtn">⏻ Déconnexion</button>
    </div>
  </header>

  <div class="layout" id="app" hidden>
    <aside>
      <h3 class="orb">BATAILLES</h3>
      <div class="blist" id="blist"></div>
      <button class="btn gold newb" id="newBtn">+ Nouvelle bataille</button>
    </aside>
    <main id="main"></main>
  </div>
  <footer>Données partagées en temps réel pour tous les membres connectés.</footer>
</div>
<div class="toast" id="toast"></div>

<div class="overlay" id="login">
  <form class="box" id="loginForm" autocomplete="off">
    <h2 class="orb"><span style="color:var(--emp)">EMPIRE</span> <span style="color:var(--mute)">VS</span> <span style="color:var(--rep)">RÉPUBLIQUE</span></h2>
    <p class="m">Connecte-toi pour accéder au compteur de tickets.</p>
    <input class="in" id="lName" placeholder="Nom" required>
    <input class="in" id="lCode" placeholder="Code" type="password" inputmode="numeric" required>
    <div class="err" id="lErr"></div>
    <button class="btn gold" id="lBtn" style="width:100%;padding:12px">Se connecter</button>
  </form>
</div>

<div class="overlay" id="accessModal" hidden>
  <div class="box wide">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 class="orb">ACCÈS</h2><button class="btn" id="closeAccess">✕</button></div>
    <p class="m">Donne un accès en créant un nom + un code (4 caractères minimum).</p>
    <div class="addrow"><input class="in" id="aName" placeholder="Nom"><input class="in" id="aCode" placeholder="Code" inputmode="numeric"></div>
    <select class="in" id="aRole"></select>
    <div class="err" id="aErr"></div>
    <button class="btn gold" id="aAdd" style="width:100%;margin-bottom:14px">+ Donner l'accès</button>
    <div id="accList"></div>
  </div>
</div>

<script type="module">
/* ====== CONFIG FIREBASE — à remplir ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB5vttBxI0YNf4nVMKAMdnYPa8fvVZ9OjA",
  authDomain: "ticket-bataille.firebaseapp.com",
  projectId: "ticket-bataille",
  storageBucket: "ticket-bataille.firebasestorage.app",
  messagingSenderId: "123950681474",
  appId: "1:123950681474:web:e5b95d71a715da67e6539b"
};
/* ======================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2000); }

if(!firebaseConfig || !firebaseConfig.apiKey){
  $("lErr").textContent="Firebase n'est pas encore configuré.";
  $("lBtn").disabled=true;
  throw new Error("firebaseConfig manquant");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const helper = getAuth(initializeApp(firebaseConfig, "helper")); // pour créer des comptes sans déconnecter l'admin

/* ===== Constantes ===== */
const GRADES = ["Domaine / Spé / Grand Spé","MDS","Seigneur / MJ","Darth / Grand Maître","MDCN / MDCJ","Homme de rang / Sous-Officier","LTN / CPT","MJR / Colonel / Commander","Commandant / Moff","Général / Grand-Moff"];
const DEFAULT_COSTS = [1,1,3,5,2,1,2,3,4,5];
const INITIAL = [["Bataille Abron","07/11"],["Bataille de Ryndellia","17/10"],["Bataille de Korvaii","04/10"],["Bataille de Houche","26/09"],["Bataille de Katorr","19/09"],["Bataille de Rodis","04/09"],["Bataille Qoribu","29/08"],["Bataille Jubilar","20/06"],["Bataille Near Pando","28/05"],["Bataille","21/02"],["Bataille Stygeon Prime","15/02/2025"]];
const ROLES = {admin:"Administrateur",ra:"Responsable Animation",rg:"Responsable Guerre",anim:"Animateur"};
const ADMIN_HASH = "942a9436127cd648b963092f6f9082fdd0791d9bba573362fb968fb9626dafd6";
function sha256(s){
  const K=[],H=[];let p=2,n=0;
  const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return false;return true};
  while(n<64){if(isP(p)){if(n<8)H[n]=(Math.pow(p,1/2)*2**32)|0;K[n]=(Math.pow(p,1/3)*2**32)|0;n++}p++}
  const bytes=[...new TextEncoder().encode(s)],bl=bytes.length*8;bytes.push(0x80);
  while(bytes.length%64!=56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push(i>=4?0:(bl>>>(i*8))&255);
  const words=[];for(let i=0;i<bytes.length;i+=4)words.push((bytes[i]<<24)|(bytes[i+1]<<16)|(bytes[i+2]<<8)|bytes[i+3]);
  const h=H.slice(),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let j=0;j<words.length;j+=16){
    const w=words.slice(j,j+16);let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      if(i>=16){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(r(x,7)^r(x,18)^(x>>>3))+w[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}
      const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    [a,b,c,d,e,f,g,hh].forEach((v,i)=>h[i]=(h[i]+v)|0);
  }
  return h.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
const DOMAIN = "tickets-bataille.app";
const ADMIN_EMAIL = "james@"+DOMAIN;

const slug = n => n.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const emailOf = n => slug(n)+"@"+DOMAIN;
const pwOf = c => "tb#"+String(c).trim()+"#tb";   // Firebase exige 6 caractères minimum

const emptyKills = () => Object.fromEntries(["e","r"].flatMap(s=>GRADES.map((_,i)=>[s+i,0])));
const newBattleData = (name,date,costs=DEFAULT_COSTS,created=Date.now()) => ({
  name, date, anim:"", start:{e:300,r:300}, bonus:{e:0,r:0}, costs:[...costs], k:emptyKills(), created
});

/* ===== État ===== */
let me = null, battles = [], users = [], current = null, unsubs = [], pending = false;
const cur = () => battles.find(b=>b.id===current) || battles[0];
const can = p => !!me && ({manage:["admin","ra"],config:["admin","ra","rg"]}[p]?.includes(me.role) ?? true);
const grantable = () => me.role==="admin"?["ra","rg","anim"]:me.role==="ra"?["rg","anim"]:[];

function calc(b){
  const lost={e:0,r:0}, dead={e:0,r:0};
  GRADES.forEach((_,i)=>["e","r"].forEach(s=>{ const n=b.k?.[s+i]||0; dead[s]+=n; lost[s]+=n*(b.costs?.[i]??0); }));
  const total={e:b.start.e-lost.e, r:b.start.r-lost.r};
  const fin={e:total.e+(+b.bonus.e||0), r:total.r+(+b.bonus.r||0)};
  return {lost,dead,total,fin,diff:fin.e-fin.r};
}

/* ===== Connexion ===== */
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const n=$("lName").value, c=$("lCode").value, em=emailOf(n);
  $("lErr").textContent=""; $("lBtn").disabled=true; $("lBtn").textContent="Connexion…";
  try{
    await signInWithEmailAndPassword(auth, em, pwOf(c));
  }catch(err){
    // Premier lancement : création automatique du compte administrateur
    if(em===ADMIN_EMAIL && sha256("tb|james|"+c.trim())===ADMIN_HASH && ["auth/invalid-credential","auth/user-not-found"].includes(err.code)){
      try{ await createUserWithEmailAndPassword(auth, em, pwOf(c)); }
      catch(e2){ $("lErr").textContent="Nom ou code incorrect."; }
    } else {
      $("lErr").textContent = err.code==="auth/too-many-requests" ? "Trop d'essais, réessaie plus tard." : "Nom ou code incorrect.";
    }
  }
  $("lBtn").disabled=false; $("lBtn").textContent="Se connecter";
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u=>u()); unsubs=[]; me=null;
  if(!user){ showLogin(); return; }
  try{
    let snap = await getDoc(doc(db,"users",user.uid));
    if(!snap.exists() && user.email===ADMIN_EMAIL){
      await setDoc(doc(db,"users",user.uid),{name:"James",role:"admin",email:user.email});
      snap = await getDoc(doc(db,"users",user.uid));
    }
    if(!snap.exists()){ await signOut(auth); $("lErr").textContent="Tu n'as pas (ou plus) accès."; return; }
    me = {uid:user.uid, ...snap.data()};
    if(me.role==="admin") await seedIfEmpty();
    startApp();
  }catch(err){ console.error(err); $("lErr").textContent="Erreur de connexion à la base."; await signOut(auth); }
});

async function seedIfEmpty(){
  const s = await getDocs(collection(db,"battles"));
  if(!s.empty) return;
  const batch = writeBatch(db), t=Date.now();
  INITIAL.forEach(([n,d],i)=>batch.set(doc(collection(db,"battles")), newBattleData(n,d,DEFAULT_COSTS,t-i)));
  await batch.commit();
}

function showLogin(){
  $("login").hidden=false; $("app").hidden=true; $("topActions").hidden=true; $("accessModal").hidden=true;
}
function startApp(){
  $("login").hidden=true; $("app").hidden=false; $("topActions").hidden=false; $("lCode").value="";
  $("userChip").innerHTML=`${esc(me.name)} <small>${ROLES[me.role]}</small>`;
  $("accessBtn").hidden=!can("manage"); $("exportBtn").hidden=!can("manage");
  unsubs.push(onSnapshot(collection(db,"battles"), s=>{
    battles = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
    if(!battles.find(b=>b.id===current)) current = battles[0]?.id;
    scheduleRender();
  }, err=>{ console.error(err); toast("Accès à la base refusé"); }));
  unsubs.push(onSnapshot(collection(db,"users"), s=>{
    users = s.docs.map(d=>({uid:d.id,...d.data()}));
    if(!users.find(u=>u.uid===me.uid)){ toast("Ton accès a été retiré"); signOut(auth); return; }
    if(!$("accessModal").hidden) renderAccess();
  }));
}

/* ===== Rendu ===== */
// Ne pas écraser un champ pendant qu'on écrit dedans
function scheduleRender(){
  const a=document.activeElement;
  if(a && a.tagName==="INPUT" && $("main").contains(a)){ pending=true; return; }
  render();
}
document.addEventListener("focusout", ()=>setTimeout(()=>{ if(pending){ pending=false; scheduleRender(); } },0));
function render(){ renderList(); renderMain(); }

function renderList(){
  $("blist").innerHTML = battles.map(b=>{
    const {diff}=calc(b), cls=diff>0?"e":diff<0?"r":"";
    return `<button class="bitem ${b.id===current?"on":""}" data-id="${b.id}">
      <span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="dot ${cls}"></span><span class="n">${esc(b.name)}</span></span>
      <span class="d">${esc(b.date)}</span></button>`;
  }).join("") || `<p style="color:var(--mute);padding:8px">Aucune bataille.</p>`;
  $("blist").querySelectorAll(".bitem").forEach(x=>x.onclick=()=>{current=x.dataset.id;render();});
}

const ctr = (i,s,v) => `<span class="ctr"><button data-i="${i}" data-s="${s}" data-d="-1">−</button><input inputmode="numeric" data-i="${i}" data-s="${s}" value="${v}"><button data-i="${i}" data-s="${s}" data-d="1">+</button></span>`;

function renderMain(){
  const b=cur(), m=$("main");
  if(!b){ m.innerHTML=`<div class="warn">Aucune bataille. Crée-en une avec « + Nouvelle bataille ».</div>`; return; }
  const k=calc(b), cfg=can("config"), dis=cfg?"":"disabled";
  const kv=(s,i)=>b.k?.[s+i]||0, cost=i=>b.costs?.[i]??0;
  const pct=s=>Math.max(0,Math.min(100,k.fin[s]/Math.max(1,b.start[s])*100));
  const lead=k.diff>0?`<span style="color:var(--emp)">Avantage Empire</span>`:k.diff<0?`<span style="color:var(--rep)">Avantage République</span>`:`<span style="color:var(--mute)">Égalité</span>`;
  m.classList.toggle("ro",!cfg);
  m.innerHTML = `
    <div class="titlebar">
      <input id="bname" value="${esc(b.name)}" aria-label="Nom de la bataille">
      <input id="bdate" class="date" value="${esc(b.date)}" placeholder="JJ/MM" aria-label="Date">
    </div>
    <div class="field anim"><label>🎙 ANIMATEUR EN CHARGE DE LA BATAILLE</label>
      <div style="display:flex;gap:8px"><input id="banim" value="${esc(b.anim||"")}" placeholder="Nom de l'animateur">${b.anim!==me.name?`<button class="btn" id="meAnim" style="flex-shrink:0">C'est moi</button>`:""}</div></div>
    <div class="warn">⚠ Faites en sorte qu'on ne soit pas 3 par faction sur les tickets.</div>
    <div class="score">
      <div class="side emp"><div class="lbl">EMPIRE</div><div class="big">${k.fin.e}</div>
        <div class="sub">−${k.lost.e} perdus · bonus ${b.bonus.e>=0?"+":""}${b.bonus.e}</div><div class="bar"><i style="width:${pct("e")}%"></i></div></div>
      <div class="vs"><div class="orb">DIFFÉRENCE</div><div class="diff">${Math.abs(k.diff)}</div><div class="lead">${lead}</div></div>
      <div class="side rep"><div class="lbl">RÉPUBLIQUE</div><div class="big">${k.fin.r}</div>
        <div class="sub">−${k.lost.r} perdus · bonus ${b.bonus.r>=0?"+":""}${b.bonus.r}</div><div class="bar"><i style="width:${pct("r")}%"></i></div></div>
    </div>
    <div class="card">
      <div class="tscroll"><table>
        <thead><tr><th style="text-align:left">GRADE</th><th>TICKETS / MORT</th><th class="e">MORTS EMPIRE</th><th class="e">PERDUS</th><th class="r">MORTS RÉPU</th><th class="r">PERDUS</th></tr></thead>
        <tbody>${GRADES.map((g,i)=>`<tr>
          <td class="grade">${esc(g)}</td>
          <td class="cost"><input inputmode="numeric" data-cost="${i}" value="${cost(i)}" ${dis}></td>
          <td class="emp-col">${ctr(i,"e",kv("e",i))}</td><td class="lost e">${kv("e",i)*cost(i)}</td>
          <td class="rep-col">${ctr(i,"r",kv("r",i))}</td><td class="lost r">${kv("r",i)*cost(i)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td style="text-align:left">Total tickets</td><td></td><td>${k.dead.e} morts</td><td class="lost e">${k.total.e}</td><td>${k.dead.r} morts</td><td class="lost r">${k.total.r}</td></tr></tfoot>
      </table></div>
      <div class="mobile-ranks">${GRADES.map((g,i)=>`<div class="mr">
        <div class="top"><b>${esc(g)}</b><label>tickets/mort <input inputmode="numeric" data-cost="${i}" value="${cost(i)}" ${dis}></label></div>
        <div class="row">
          <div class="s e emp-col"><small>Morts Empire</small>${ctr(i,"e",kv("e",i))}<small>−${kv("e",i)*cost(i)} tickets</small></div>
          <div class="s r rep-col"><small>Morts Répu</small>${ctr(i,"r",kv("r",i))}<small>−${kv("r",i)*cost(i)} tickets</small></div>
        </div></div>`).join("")}</div>
    </div>
    <div class="extras">
      <div class="field e"><label>TICKETS DE DÉPART EMPIRE</label><input inputmode="numeric" data-f="start.e" value="${b.start.e}" ${dis}></div>
      <div class="field e"><label>BONUS EMPIRE</label><input inputmode="numeric" data-f="bonus.e" value="${b.bonus.e}"></div>
      <div class="field r"><label>TICKETS DE DÉPART RÉPU</label><input inputmode="numeric" data-f="start.r" value="${b.start.r}" ${dis}></div>
      <div class="field r"><label>BONUS RÉPUBLIQUE</label><input inputmode="numeric" data-f="bonus.r" value="${b.bonus.r}"></div>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn">📋 Copier le résumé</button>
      <button class="btn" id="dupBtn">⧉ Dupliquer</button>
      ${cfg?`<button class="btn danger" id="resetBtn">↺ Remettre à zéro</button><button class="btn danger" id="delBtn">🗑 Supprimer</button>`:""}
    </div>`;
  bind(b);
}

const num = v => { const n=parseInt(String(v).replace(/[^\d-]/g,""),10); return isNaN(n)?0:n; };
const save = (b,data) => updateDoc(doc(db,"battles",b.id), data).catch(err=>{ console.error(err); toast("Modification refusée"); render(); });

function bind(b){
  const m=$("main");
  m.querySelectorAll(".ctr button").forEach(x=>x.onclick=()=>{
    const key=x.dataset.s+x.dataset.i, d=+x.dataset.d;
    if(d<0 && (b.k?.[key]||0)<=0) return;
    save(b,{["k."+key]:increment(d)});
  });
  m.querySelectorAll(".ctr input").forEach(x=>x.onchange=()=>save(b,{["k."+x.dataset.s+x.dataset.i]:Math.max(0,num(x.value))}));
  m.querySelectorAll("[data-cost]").forEach(x=>x.onchange=()=>{ const c=[...(b.costs||DEFAULT_COSTS)]; c[x.dataset.cost]=Math.max(0,num(x.value)); save(b,{costs:c}); });
  m.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>save(b,{[x.dataset.f]:num(x.value)}));
  $("bname").onchange=e=>save(b,{name:e.target.value.trim()||"Bataille"});
  $("bdate").onchange=e=>save(b,{date:e.target.value.trim()});
  $("banim").onchange=e=>save(b,{anim:e.target.value.trim()});
  if($("meAnim")) $("meAnim").onclick=()=>save(b,{anim:me.name});
  if($("resetBtn")) $("resetBtn").onclick=()=>{ if(confirm("Remettre tous les morts et bonus à zéro ?")) save(b,{k:emptyKills(),bonus:{e:0,r:0}}); };
  if($("delBtn")) $("delBtn").onclick=()=>{ if(confirm(`Supprimer « ${b.name} » pour tout le monde ?`)) deleteDoc(doc(db,"battles",b.id)).then(()=>toast("Bataille supprimée")).catch(()=>toast("Suppression refusée")); };
  $("dupBtn").onclick=async()=>{
    const {id,...data}=b; const r=await addDoc(collection(db,"battles"),{...data,name:b.name+" (copie)",created:Date.now()}).catch(()=>null);
    if(r){ current=r.id; toast("Bataille dupliquée"); }
  };
  $("copyBtn").onclick=()=>{
    const k=calc(b);
    const txt=`**${b.name}${b.date?" — "+b.date:""}**\n${b.anim?"Animateur : "+b.anim+"\n":""}Empire : ${k.fin.e} tickets (−${k.lost.e}, bonus ${b.bonus.e})\nRépublique : ${k.fin.r} tickets (−${k.lost.r}, bonus ${b.bonus.r})\nDifférence : ${Math.abs(k.diff)} — ${k.diff>0?"avantage Empire":k.diff<0?"avantage République":"égalité"}`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Résumé copié"),()=>prompt("Copie ce texte :",txt));
  };
}

$("newBtn").onclick=async()=>{
  const d=new Date(), date=`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  const r=await addDoc(collection(db,"battles"), newBattleData("Nouvelle bataille",date,cur()?.costs||DEFAULT_COSTS)).catch(()=>null);
  if(!r) return toast("Création refusée");
  current=r.id; render(); setTimeout(()=>$("bname")?.select(),50);
};

$("exportBtn").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),battles},null,2)],{type:"application/json"}));
  a.download="sauvegarde-tickets-bataille.json"; a.click(); toast("Sauvegarde téléchargée");
};

/* ===== Gestion des accès ===== */
function renderAccess(){
  $("aRole").innerHTML=grantable().map(r=>`<option value="${r}">${ROLES[r]}</option>`).join("");
  const order={admin:0,ra:1,rg:2,anim:3};
  $("accList").innerHTML=[...users].sort((a,b)=>order[a.role]-order[b.role]||a.name.localeCompare(b.name)).map(u=>{
    const del=u.uid!==me.uid && grantable().includes(u.role);
    return `<div class="acc"><div><b>${esc(u.name)}</b><small>${ROLES[u.role]||u.role}</small></div>${del?`<button class="btn danger" data-del="${u.uid}">Retirer</button>`:""}</div>`;
  }).join("");
  $("accList").querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{
    const u=users.find(v=>v.uid===x.dataset.del);
    if(confirm(`Retirer l'accès de ${u.name} ?`)) deleteDoc(doc(db,"users",u.uid)).then(()=>toast("Accès retiré")).catch(()=>toast("Action refusée"));
  });
}
$("accessBtn").onclick=()=>{ $("aErr").textContent=""; renderAccess(); $("accessModal").hidden=false; };
$("closeAccess").onclick=()=>$("accessModal").hidden=true;
$("aAdd").onclick=async()=>{
  const n=$("aName").value.trim(), c=$("aCode").value.trim(), role=$("aRole").value, err=$("aErr");
  err.textContent="";
  if(!n||!c) return err.textContent="Mets un nom et un code.";
  if(!slug(n)) return err.textContent="Nom invalide.";
  if(c.length<4) return err.textContent="Le code doit faire au moins 4 caractères.";
  if(!grantable().includes(role)) return err.textContent="Tu ne peux pas donner ce rôle.";
  if(users.find(u=>slug(u.name)===slug(n))) return err.textContent="Ce nom a déjà un accès.";
  $("aAdd").disabled=true;
  try{
    let cred;
    try{ cred=await createUserWithEmailAndPassword(helper, emailOf(n), pwOf(c)); }
    catch(e){
      if(e.code!=="auth/email-already-in-use") throw e;
      // ancien compte retiré : on le réactive si le code est le même
      try{ cred=await signInWithEmailAndPassword(helper, emailOf(n), pwOf(c)); }
      catch(_){ throw {msg:"Ce nom a déjà existé avec un autre code. Utilise ce code-là ou un autre nom."}; }
    }
    await setDoc(doc(db,"users",cred.user.uid),{name:n,role,email:emailOf(n)});
    await signOut(helper);
    $("aName").value=$("aCode").value=""; toast(`Accès donné à ${n}`);
  }catch(e){ console.error(e); err.textContent=e.msg||"Impossible de créer l'accès."; }
  $("aAdd").disabled=false;
};
</script>
</body>
